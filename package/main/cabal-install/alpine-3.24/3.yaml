# syntax=dhi.io/build:2-alpine3.24

image: dhi.io/pkg-cabal-install
variant: runtime
tags:
  - 3.18.1.0-alpine3.24
  - 3.18.1.0-r0-alpine3.24
platforms:
  - linux/amd64
  - linux/arm64
vars:
  BOOTSTRAP_GHC_NAME: ghc-9.12
  BOOTSTRAP_GHC_SEMVER: 9.12.4
  BOOTSTRAP_GHC_VERSION: 9.12.4-r0
  BOOTSTRAP_PLAN: linux-9.12.4.json
  CABAL_SRC_CHECKSUM: sha256:5ad45c874c9698f28228b0c15a6933d7ec0dd7dcf50800b7b17e281fadf924b7
  REL: "0"
  VERSION: 3.18.1.0
contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.24/main
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/community
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
  packages:
    - alpine-baselayout-data
  builds:
    - name: cabal-install
      work-dir: ${source.dir}/cabal
      contents:
        packages:
          - ghc-9.12=9.12.4-r0
          - binutils
          - busybox
          - ca-certificates
          - g++
          - gcc
          - gmp-dev
          - libffi-dev
          - make
          - musl-dev
          - ncurses-libs
          - numactl-dev
          - pkgconf
          - python3
          - tar
          - xz
          - zlib-dev
        files:
          - url: https://keyserver.ubuntu.com/pks/lookup?op=get&search=0xe9ec5616017c3ee26b33468cce1ed8ae0b011d8c
            path: ${source.dir}/keys/cabal/mikolaj-konarski.asc
            uid: 0
            gid: 0
          - url: https://keyserver.ubuntu.com/pks/lookup?op=get&search=0xdafb4d8af684143518d5051fa9af0aaa6b87ec51
            path: ${source.dir}/keys/cabal/francesco-ariis.asc
            uid: 0
            gid: 0
          - url: https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x665b13a7c42cc972cccc0717a31c1bfa09b1f47d
            path: ${source.dir}/keys/cabal/artem-pelenitsyn.asc
            uid: 0
            gid: 0
          - url: https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x1e07c9a1a3088bad47f74a3e227ee1942b0bdb95
            path: ${source.dir}/keys/cabal/brandon-allbery.asc
            uid: 0
            gid: 0
          - url: https://downloads.haskell.org/~cabal/cabal-install-3.18.1.0/SHA256SUMS
            path: ${source.dir}/SHA256SUMS
            uid: 0
            gid: 0
          - url: https://downloads.haskell.org/~cabal/cabal-install-3.18.1.0/SHA256SUMS.sig
            path: ${source.dir}/SHA256SUMS.sig
            uid: 0
            gid: 0
          - url: https://downloads.haskell.org/~cabal/cabal-install-3.18.1.0/cabal-3.18.1.0-src.tar.gz
            checksum: sha256:5ad45c874c9698f28228b0c15a6933d7ec0dd7dcf50800b7b17e281fadf924b7
            path: ${source.dir}/cabal-src.tar.gz
            uid: 0
            gid: 0
      pipeline:
        - name: prepare Cabal release keyring
          runs: |
            set -eux -o pipefail

            cat \
              "${source.dir}/keys/cabal/mikolaj-konarski.asc" \
              "${source.dir}/keys/cabal/francesco-ariis.asc" \
              "${source.dir}/keys/cabal/artem-pelenitsyn.asc" \
              "${source.dir}/keys/cabal/brandon-allbery.asc" \
              > /tmp/cabal-release-keys.asc
        - name: verify SHA256SUMS
          uses: gpg/verify@v1
          with:
            file: ${source.dir}/SHA256SUMS
            keys: /tmp/cabal-release-keys.asc
            signature: ${source.dir}/SHA256SUMS.sig
        - name: prepare release dependencies
          privileged: true
          runs: |
            set -eux -o pipefail

            tar -xzf "${source.dir}/cabal-src.tar.gz" --strip-components=1
            python3 "${source.dir}/source-metadata.py" fetch --source . --plan "linux-9.12.4.json"
        - name: bootstrap cabal
          runs: |
            set -eux -o pipefail

            ghc="/usr/lib/ghc-9.12/bin/ghc"
            test "$("${ghc}" --numeric-version)" = "9.12.4"

            ./bootstrap/bootstrap.py -d "./bootstrap/linux-9.12.4.json" -w "${ghc}"
            install -Dm0755 _build/bin/cabal "${target.dir}/usr/bin/cabal"
        - name: record Cabal library components
          runs: |
            set -eux -o pipefail

            python3 "${source.dir}/source-metadata.py" sbom \
              --source . --plan "linux-9.12.4.json" \
              --compiler-root "/usr/lib/ghc-9.12" --compiler-version "9.12.4" \
              --version "3.18.1.0" \
              --output "${target.dir}/opt/docker/sbom/cabal-install/.spdx.cabal-install.json"
        - uses: dhi/build-pkg:0
          with:
            depends:
              - ca-certificates
              - curl
              - gmp
              - numactl
              - zlib
            description: Command-line interface for Cabal and Hackage
            files:
              - usr/bin/cabal
              - opt/docker/sbom/cabal-install
            formats:
              - apk
            license: BSD-3-Clause
            name: cabal-install
            rel: 0
            url: https://www.haskell.org/cabal/
            version: 3.18.1.0
      paths:
        - type: file
          path: ${source.dir}/source-metadata.py
          uid: 0
          gid: 0
          mode: "0644"
          source: package/main/cabal-install/source-metadata.py
os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.24"
  pretty-name: Docker Hardened Images/Alpine Linux v3.24
  home-url: https://docker.com/products/hardened-images/
