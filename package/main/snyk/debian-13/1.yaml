  SNYK_ARM64_CHECKSUM: sha256:694c014c1d0db25b481092fd7df6edf6e01449d5ab7b043843a6fb41c141ba08
  SNYK_ASSET: '#{ target.arch == "arm64" ? "snyk-linux-arm64" : "snyk-linux" }'
