  SNYK_FIPS_ARM64_CHECKSUM: sha256:6cc90630ba1791ec43ca1abde319f97c177f22284fc557d50f0170b5b0b57e37
  SNYK_FIPS_CHECKSUM: '#{ target.arch == "arm64" ? "sha256:6cc90630ba1791ec43ca1abde319f97c177f22284fc557d50f0170b5b0b57e37" : "sha256:7b7451eef6b58f12e6c6cdaafcc1b57d65947a3b01e1bb7d9ef8e9053a9f7d11" }'
  VERSION: 1.1307.4
contents:
  packages:
    - '!base-files'
  builds:
    - name: snyk deb
      work-dir: ${source.dir}/snyk
      contents:
        packages:
          - debhelper
          - dpkg-dev
          - make
        files:
          - url: https://github.com/snyk/cli/releases/download/v1.1307.4/${SNYK_ASSET}
            checksum: ${SNYK_CHECKSUM}
            path: ${source.dir}/snyk/${SNYK_ASSET}
            uid: 0
            gid: 0
      pipeline:
        - name: stage binary
          runs: |
            set -eux -o pipefail

            install -m0755 "${SNYK_ASSET}" snyk
            rm -f "${SNYK_ASSET}"
        - uses: dpkg/bump@v1
          with:
            changelog:
              - DHI Build
            version: 1.1307.4-0
        - uses: dpkg/build@v1
          with:
            args: -b -uc -us -d
      paths:
        - type: directory
          path: ${source.dir}/snyk/debian
          uid: 0
          gid: 0
          mode: "0600"
          source: package/main/snyk/debian-13/debian
